<style>
  /* Reset & Container Utama */
  .landing-card {
    max-width: 450px;
    margin: 0 auto;
    
    /* Memanggil gambar lokal dari repository GitHub */
    background-image: linear-gradient(rgba(11, 15, 25, 0.85), rgba(11, 15, 25, 0.95)), 
                      url("banner.png");
    
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    border-radius: 12px;
    border: 2px solid #1e293b;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #ffffff;
    overflow: hidden;
    padding: 15px;
  }

  .header-logo {
    text-align: center;
    padding: 10px 0;
  }
  .header-logo h1 {
    color: #f59e0b;
    font-size: 28px;
    font-weight: 900;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    display: inline-block;
  }

  .banner-container {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #334155;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  }
  .banner-container img {
    width: 100%;
    height: auto;
    display: block;
  }

  .sub-title {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #38bdf8;
    margin: 15px 0;
    letter-spacing: 1px;
    line-height: 1.4;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
  }

  .status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
  }
  .status-box {
    background-color: rgba(21, 29, 42, 0.8); 
    backdrop-filter: blur(4px);
    border: 1px solid #1e293b;
    border-radius: 6px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .status-label {
    color: #94a3b8;
    font-weight: 600;
  }
  .status-value {
    color: #38bdf8;
    font-weight: bold;
  }
  .stars {
    color: #fbbf24;
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }
  .btn-action {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-weight: 800;
    font-size: 14px;
    text-decoration: none;
    border-radius: 6px;
    text-transform: uppercase;
    transition: all 0.2s ease;
  }
  .btn-daftar {
    background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
    color: #000;
    box-shadow: 0 4px 10px rgba(234, 179, 8, 0.4);
  }
  .btn-login {
    background-color: rgba(30, 41, 59, 0.9);
    color: #f8fafc;
    border: 1px solid #475569;
  }
  .btn-action:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }

  .detail-table {
    width: 100%;
    background-color: rgba(21, 29, 42, 0.8);
    border-radius: 6px;
    border-collapse: collapse;
    overflow: hidden;
    font-size: 13px;
  }
  .detail-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #1e293b;
  }
  .detail-table tr:last-child td {
    border-bottom: none;
  }
  .table-label {
    color: #94a3b8;
    font-weight: 600;
    width: 40%;
  }
  .table-val {
    color: #ffffff;
    font-weight: 700;
  }
</style>

<div class="landing-card">
  <div class="header-logo">
    <h1>KARTEL62</h1>
  </div>

  <!-- Gambar Banner Lokal -->
  <div class="banner-container">
    <img src="banner.png" alt="Promo KARTEL62 Banner">
  </div>

  <div class="sub-title">
    KARTEL62 • SLOT GACOR RTP LIVE TINGGI • MUDAH MAXWIN 2026
  </div>

  <div class="status-grid">
    <div class="status-box">
      <span class="status-label">RATING</span>
      <span class="stars">★★★★★</span>
    </div>
    <div class="status-box">
      <span class="status-label">DEPO</span>
      <span class="status-value">10 RIBU</span>
    </div>
    <div class="status-box">
      <span class="status-label">WIN RATE</span>
      <span class="status-value">99%</span>
    </div>
    <div class="status-box">
      <span class="status-label">WD</span>
      <span class="status-value">UNLIMITED</span>
    </div>
  </div>

  <div class="action-buttons">
    <a href="https://abc.kartel62.online/" target="_blank" class="btn-action btn-daftar">DAFTAR</a>
    <a href="https://abc.kartel62.online/" target="_blank" class="btn-action btn-login">LOGIN</a>
  </div>

  <table class="detail-table">
    <tr>
      <td class="table-label">NAMA SITUS</td>
      <td class="table-val">KARTEL62</td>
    </tr>
    <tr>
      <td class="table-label">MIN. DEPOSIT</td>
      <td class="table-val">Rp 10.000</td>
    </tr>
  </table>
</div>

<style>
  /* Reset & Container Utama dengan Background Gambar */
  .landing-card {
    max-width: 450px;
    margin: 0 auto;
    
    /* MENAMBAHKAN BACKGROUND GAMBAR & OVERLAY GELAP */
    /* Menambahkan lapisan hitam transparan (0.85) agar teks tetap terbaca jelas */
    background-image: linear-gradient(rgba(11, 15, 25, 0.85), rgba(11, 15, 25, 0.95)), 
                      url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgo_DPIN_bnwtgIopfWy1668GSPMISW8HvxvAcDl2NEBcEIi7MPaq5AkXE1WMbAMNzQACNzgXvbpmOqzhA2XwdI2EaBeQgP9fxL8ufhGoQRzbLniCH1hNlM1_M5FX094J_p_6G_VMkFXRxKHuuH1n0yNQC7w7BCpWq0ZpfNo3qLrgARXnVCzFvCF3ywXq3e/s1024/Gemini_Generated_Image_3awe2b3awe2b3awe%20(1).png");
    
    /* Mengatur agar gambar menutupi seluruh area dan rata tengah */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    border-radius: 12px;
    border: 2px solid #1e293b;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #ffffff;
    overflow: hidden;
    padding: 15px;
  }

  /* Logo Header */
  .header-logo {
    text-align: center;
    padding: 10px 0;
  }
  .header-logo h1 {
    color: #f59e0b;
    font-size: 28px;
    font-weight: 900;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    display: inline-block;
  }

  /* Area Banner Gambar Utama */
  .banner-container {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #334155;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Menambah sedikit bayangan agar banner menonjol */
  }
  .banner-container img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Subtitle Teks */
  .sub-title {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #38bdf8;
    margin: 15px 0;
    letter-spacing: 1px;
    line-height: 1.4;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8); /* Menambah bayangan teks agar lebih jelas di atas background */
  }

  /* Grid Informasi Status */
  .status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
  }
  .status-box {
    /* Membuat kotak status sedikit transparan agar background terlihat sedikit */
    background-color: rgba(21, 29, 42, 0.8); 
    backdrop-filter: blur(4px); /* Efek blur kaca tipis */
    border: 1px solid #1e293b;
    border-radius: 6px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .status-label {
    color: #94a3b8;
    font-weight: 600;
  }
  .status-value {
    color: #38bdf8;
    font-weight: bold;
  }
  .stars {
    color: #fbbf24;
  }

  /* Tombol Aksi */
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }
  .btn-action {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-weight: 800;
    font-size: 14px;
    text-decoration: none;
    border-radius: 6px;
    text-transform: uppercase;
    transition: all 0.2s ease;
  }
  .btn-daftar {
    background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
    color: #000;
    box-shadow: 0 4px 10px rgba(234, 179, 8, 0.4);
  }
  .btn-login {
    background-color: rgba(30, 41, 59, 0.9); /* Sedikit transparan */
    color: #f8fafc;
    border: 1px solid #475569;
  }
  .btn-action:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }

  /* Tabel Detail */
  .detail-table {
    width: 100%;
    background-color: rgba(21, 29, 42, 0.8); /* Sedikit transparan */
    border-radius: 6px;
    border-collapse: collapse;
    overflow: hidden;
    font-size: 13px;
  }
  .detail-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #1e293b;
  }
  .detail-table tr:last-child td {
    border-bottom: none;
  }
  .table-label {
    color: #94a3b8;
    font-weight: 600;
    width: 40%;
  }
  .table-val {
    color: #ffffff;
    font-weight: 700;
  }
</style>

<div class="landing-card">

  <!-- Text Informasi -->

  <!-- Tombol Link (Daftar & Login) -->

</div>
